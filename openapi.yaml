openapi: 3.0.3
info:
  title: MiniBlog API
  version: 1.0.0
  description: API para la gestión de autores y publicaciones de un blog.
servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo
  - url: https://proyecto12-eduardomaciel-miniblog-1.onrender.com
    description: API desplegada en Render
paths:
  /authors:
    get:
      summary: Obtener todos los autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear un nuevo autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Autor creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Datos inválidos o correo electrónico ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /authors/{id}:
    get:
      summary: Obtener un autor por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID del autor a buscar
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Autor encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar un autor existente
      parameters:
        - name: id
          in: path
          required: true
          description: ID del autor a actualizar
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Autor actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Datos de entrada inválidos o correo electrónico ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar un autor por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID del autor a eliminar
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Autor eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  author:
                    $ref: '#/components/schemas/Author'
                required:
                  - message
                  - author
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts:
    get:
      summary: Obtener todas las publicaciones
      responses:
        '200':
          description: Lista de publicaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Crear una nueva publicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Publicación creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{id}:
    get:
      summary: Obtener una publicación por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la publicación a buscar
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Publicación encontrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Actualizar una publicación existente
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la publicación a actualizar
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Publicación actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Eliminar una publicación por su ID
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la publicación a eliminar
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Publicación eliminada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  post:
                    $ref: '#/components/schemas/Post'
                required:
                  - message
                  - post
        '404':
          description: Publicación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/author/{authorId}:
    get:
      summary: Obtener publicaciones por el ID del autor
      parameters:
        - name: authorId
          in: path
          required: true
          description: ID del autor cuyas publicaciones se quieren obtener
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Lista de publicaciones del autor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostByAuthor'
        '404':
          description: Autor no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 150
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        bio:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - created_at
    AuthorInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '\S'
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 150
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        bio:
          type: string
          nullable: true
      required:
        - name
        - email
    Post:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        content:
          type: string
          minLength: 1
          pattern: '\S'
        author_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        published:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - author_id
        - published
        - created_at
    PostInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        content:
          type: string
          minLength: 1
          pattern: '\S'
        author_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        published:
          type: boolean
      required:
        - title
        - content
        - author_id
    PostByAuthor:
      type: object
      properties:
        id:
          type: integer
          format: int32
        title:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '\S'
        content:
          type: string
          minLength: 1
          pattern: '\S'
        author_id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        published:
          type: boolean
        created_at:
          type: string
          format: date-time
        author_name:
          type: string
          maxLength: 100
        author_email:
          type: string
          format: email
          maxLength: 150
          pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
        author_bio:
          type: string
          nullable: true
      required:
        - id
        - title
        - content
        - author_id
        - published
        - created_at
        - author_name
        - author_email
        - author_bio
    Error:
      type: object
      properties:
        message:
          type: string
      required:
        - message